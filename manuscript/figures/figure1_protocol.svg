<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="'Times New Roman', 'DejaVu Serif', serif" font-size="13">
  <title>Figure 1. N-of-1 protocol overview and decision rules</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#333"/></marker>
    <marker id="ah-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#009E73"/></marker>
    <marker id="ah-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#D55E00"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#E69F00"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#CC79A7"/></marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold">Figure 1. N-of-1 protocol overview and decision rules</text>

  <!-- ===== LEFT COLUMN: protocol steps (x=250 center) ===== -->

  <!-- Step 0 -->
  <rect x="100" y="55" width="300" height="75" rx="10" fill="#E8F5E9" stroke="#009E73" stroke-width="1.5"/>
  <text x="250" y="80" text-anchor="middle" font-weight="bold">Step 0: Eligibility</text>
  <text x="250" y="98" text-anchor="middle" font-size="12">CKD 3b–4, stable eGFR</text>
  <text x="250" y="116" text-anchor="middle" font-size="12">IS assay available</text>
  <line x1="250" y1="130" x2="250" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 1 -->
  <rect x="100" y="170" width="300" height="75" rx="10" fill="#E3F2FD" stroke="#0072B2" stroke-width="1.5"/>
  <text x="250" y="194" text-anchor="middle" font-weight="bold">Step 1: Measurement standardization</text>
  <text x="250" y="212" text-anchor="middle" font-size="12">Fasting AM, duplicate draws</text>
  <text x="250" y="230" text-anchor="middle" font-size="12">→ target CV ≈ 0.15</text>
  <line x1="250" y1="245" x2="250" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 2 -->
  <rect x="100" y="285" width="300" height="75" rx="10" fill="#FFF3E0" stroke="#E69F00" stroke-width="1.5"/>
  <text x="250" y="309" text-anchor="middle" font-weight="bold">Step 2: Stage 1 (wk 0–24)</text>
  <text x="250" y="327" text-anchor="middle" font-size="12">2 × 3 AB crossover</text>
  <text x="250" y="345" text-anchor="middle" font-size="12">12 visits, 24 duplicate draws</text>
  <line x1="250" y1="360" x2="250" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 3: Classification -->
  <rect x="100" y="403" width="300" height="85" rx="10" fill="#FCE4EC" stroke="#D55E00" stroke-width="1.5"/>
  <text x="250" y="428" text-anchor="middle" font-weight="bold">Step 3: Classification</text>
  <text x="250" y="448" text-anchor="middle" font-size="11">obs_red = (mean_A − mean_B) / mean_A</text>
  <text x="250" y="468" text-anchor="middle" font-size="12">vs MDE threshold</text>

  <!-- ===== RIGHT COLUMN: outcome boxes (widely spaced) ===== -->

  <!-- RESPONDER (top right, y aligned with Step 3 top) -->
  <rect x="610" y="390" width="240" height="60" rx="10" fill="#E8F5E9" stroke="#009E73" stroke-width="1.5"/>
  <text x="730" y="416" text-anchor="middle" font-weight="bold" fill="#009E73">RESPONDER</text>
  <text x="730" y="436" text-anchor="middle" font-size="12">Continue regimen</text>

  <!-- NON-RESPONDER (far below RESPONDER, clear vertical gap) -->
  <rect x="610" y="560" width="240" height="60" rx="10" fill="#FFEBEE" stroke="#D55E00" stroke-width="1.5"/>
  <text x="730" y="586" text-anchor="middle" font-weight="bold" fill="#D55E00">NON-RESPONDER</text>
  <text x="730" y="606" text-anchor="middle" font-size="12">Stop, deprescribe</text>

  <!-- ===== STAGE 1 BRANCHES (solid arrows) ===== -->

  <!-- Step 3 → RESPONDER: horizontal from right edge of Step 3 -->
  <line x1="400" y1="420" x2="607" y2="420" stroke="#009E73" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <text x="503" y="410" text-anchor="middle" font-size="11" fill="#009E73" font-weight="bold">obs_red &gt; 14%</text>

  <!-- Step 3 → NON-RESPONDER: angled line, label below the line near destination -->
  <line x1="400" y1="475" x2="607" y2="585" stroke="#D55E00" stroke-width="1.8" marker-end="url(#ah-red)"/>
  <text x="570" y="575" text-anchor="end" font-size="11" fill="#D55E00" font-weight="bold">obs_red &lt; 0%</text>

  <!-- Step 3 → BORDERLINE (straight down), label to the LEFT of arrow -->
  <line x1="250" y1="488" x2="250" y2="580" stroke="#E69F00" stroke-width="1.8" marker-end="url(#ah-orange)"/>
  <text x="130" y="535" font-size="11" fill="#E69F00" font-weight="bold">obs_red 0–14%</text>
  <text x="130" y="550" font-size="10" fill="#E69F00">(borderline)</text>

  <!-- ===== Step 4: Stage 2 ===== -->
  <rect x="100" y="585" width="300" height="85" rx="10" fill="#FFF3E0" stroke="#E69F00" stroke-width="1.5"/>
  <text x="250" y="610" text-anchor="middle" font-weight="bold">Step 4: Stage 2 (wk 24–36)</text>
  <text x="250" y="630" text-anchor="middle" font-size="12">+1 AB cycle, borderline only</text>
  <text x="250" y="650" text-anchor="middle" font-size="12">Combine 9+9 measures, MDE = 12%</text>

  <!-- ===== STAGE 2 BRANCHES (dashed arrows) ===== -->

  <!-- Step 4 → RESPONDER: goes up-right, label above the line -->
  <line x1="400" y1="610" x2="607" y2="445" stroke="#009E73" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#ah-green)"/>
  <text x="470" y="500" font-size="10" fill="#009E73">obs_red &gt; 12%</text>

  <!-- Step 4 → NON-RESPONDER: angled right, label below the line -->
  <line x1="400" y1="640" x2="607" y2="590" stroke="#D55E00" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#ah-red)"/>
  <text x="470" y="650" font-size="10" fill="#D55E00">obs_red ≤ 12%</text>

  <!-- ===== Step 5: Follow-up (full width at bottom) ===== -->
  <rect x="100" y="750" width="750" height="85" rx="10" fill="#F3E5F5" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="475" y="775" text-anchor="middle" font-weight="bold">Step 5: Follow-up (all classified patients)</text>
  <text x="475" y="795" text-anchor="middle" font-size="12">Responders: continue regimen, measure IS every 3 months</text>
  <text x="475" y="815" text-anchor="middle" font-size="12">Non-responders: stop regimen, deprescribe review. If IS rises &gt;20% → reassess</text>

  <!-- RESPONDER → Step 5: right side, down, avoids NON-RESP -->
  <polyline points="850,420 870,420 870,747" fill="none" stroke="#CC79A7" stroke-width="1.2" marker-end="url(#ah-purple)"/>

  <!-- NON-RESPONDER → Step 5: straight down -->
  <line x1="730" y1="620" x2="730" y2="747" stroke="#CC79A7" stroke-width="1.2" marker-end="url(#ah-purple)"/>

  <!-- ===== PHASE LABELS (left margin) ===== -->
  <text x="15" y="93" font-size="11" fill="#999" font-style="italic">Screening</text>
  <text x="15" y="208" font-size="11" fill="#999" font-style="italic">Preparation</text>
  <text x="15" y="323" font-size="11" fill="#999" font-style="italic">Trial</text>
  <text x="15" y="446" font-size="11" fill="#999" font-style="italic">Decision</text>
  <text x="15" y="628" font-size="11" fill="#999" font-style="italic">Adaptive</text>
  <text x="15" y="793" font-size="11" fill="#999" font-style="italic">Monitoring</text>

  <!-- ===== LEGEND ===== -->
  <text x="100" y="870" font-size="10" fill="#666">obs_red = observed IS reduction (%). Solid arrows: Stage 1 paths. Dashed: Stage 2 paths.</text>
  <text x="100" y="886" font-size="10" fill="#666">~70% classified at Stage 1 (wk 24). ~30% borderline proceed to Stage 2 (wk 36).</text>
</svg>
